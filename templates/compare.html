<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Properties | NestFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: #F5F6FA;
        }
        
        .navbar {
            background: var(--navy);
            padding: 1rem 0;
        }
        
        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: white !important;
        }
        
        .navbar-brand span {
            color: var(--gold);
        }
        
        .nav-link {
            color: rgba(255,255,255,0.8) !important;
        }
        
        :root {
            --navy: #0B1F3A;
            --gold: #C9A84C;
            --grey: #6B7A99;
            --grey-light: #E8ECF4;
            --red: #dc3545;
        }
        
        .compare-container {
            padding: 7rem 0 3rem;
            min-height: 100vh;
        }
        
        .compare-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .compare-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--navy);
        }
        
        .compare-header p {
            color: var(--grey);
        }
        
        /* Comparison Table Styles */
        .comparison-table {
            background: white;
            border-radius: 20px;
            overflow-x: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        
        .comparison-table table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        
        .comparison-table th,
        .comparison-table td {
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid var(--grey-light);
            vertical-align: middle;
        }
        
        .comparison-table th {
            background: var(--navy);
            color: white;
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
        }
        
        .comparison-table tr:first-child th {
            padding: 1.5rem 1rem;
        }
        
        .comparison-table td {
            color: var(--grey-dark);
        }
        
        .comparison-table .label-cell {
            background: #F8F6F0;
            font-weight: 600;
            color: var(--navy);
            text-align: left;
            width: 150px;
        }
        
        .property-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 0.5rem;
        }
        
        .property-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--navy);
            margin-top: 0.5rem;
        }
        
        .property-price {
            color: var(--gold);
            font-weight: 800;
            font-size: 1.1rem;
        }
        
        .remove-btn {
            background: none;
            border: none;
            color: var(--red);
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 0.5rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .remove-btn:hover {
            text-decoration: underline;
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 20px;
        }
        
        .empty-state i {
            font-size: 3rem;
            color: var(--grey-light);
            margin-bottom: 1rem;
        }
        
        .empty-state h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }
        
        .btn-add-more {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.7rem 1.8rem;
            background: var(--gold);
            color: var(--navy);
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
        }
        
        .btn-clear {
            display: inline-block;
            margin-top: 1.5rem;
            margin-left: 1rem;
            padding: 0.7rem 1.8rem;
            background: var(--grey-light);
            color: var(--grey);
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        
        .badge-active {
            background: #28a745;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        
        .badge-sold {
            background: var(--red);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        
        @media (max-width: 768px) {
            .comparison-table th,
            .comparison-table td {
                padding: 0.75rem;
                font-size: 0.75rem;
            }
            
            .property-image {
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">Nest<span>Find</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/properties">Properties</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="compare-container">
        <div class="container">
            <div class="compare-header">
                <h1><i class="fa-solid fa-chart-simple"></i> Compare Properties</h1>
                <p>Compare up to 4 properties side by side</p>
            </div>

            <div id="compareContent">
                <div class="text-center py-5">
                    <div class="spinner-border text-gold" role="status"></div>
                    <p class="mt-3">Loading comparison...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Load comparison on page load
        document.addEventListener('DOMContentLoaded', loadComparison);

        async function loadComparison() {
            const container = document.getElementById('compareContent');
            
            // Get property IDs from localStorage
            let compareIds = localStorage.getItem('compareProperties');
            compareIds = compareIds ? JSON.parse(compareIds) : [];
            
            if (compareIds.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-chart-bar"></i>
                        <h3>No properties to compare</h3>
                        <p>Add properties to compare from the search results or favorites page.</p>
                        <a href="/properties" class="btn-add-more">
                            <i class="fa-solid fa-building"></i> Browse Properties
                        </a>
                    </div>
                `;
                return;
            }
            
            if (compareIds.length < 2) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-chart-bar"></i>
                        <h3>Add one more property to compare</h3>
                        <p>You have ${compareIds.length} property selected. Add at least 2 to compare.</p>
                        <a href="/properties" class="btn-add-more">
                            <i class="fa-solid fa-plus"></i> Add More
                        </a>
                        <button onclick="clearComparison()" class="btn-clear">
                            <i class="fa-solid fa-trash"></i> Clear All
                        </button>
                    </div>
                `;
                return;
            }
            
            // Fetch property details
            try {
                const properties = [];
                for (const id of compareIds) {
                    const response = await fetch(`/api/property/${id}`);
                    const data = await response.json();
                    if (data.id) {
                        properties.push(data);
                    }
                }
                
                if (properties.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>No valid properties found.</p></div>';
                    return;
                }
                
                renderComparisonTable(properties);
                
            } catch (error) {
                console.error('Error loading properties:', error);
                container.innerHTML = '<div class="empty-state"><p class="text-danger">Error loading comparison. Please try again.</p></div>';
            }
        }
        
        function renderComparisonTable(properties) {
            const container = document.getElementById('compareContent');
            
            // Define comparison fields in correct order
            const fields = [
                { key: 'property', label: 'Property Name' },
                { key: 'price', label: 'Price' },
                { key: 'location', label: 'Location' },
                { key: 'bedrooms', label: 'Bedrooms' },
                { key: 'area', label: 'Area (sq.ft)' },
                { key: 'type', label: 'Listing Type' },
                { key: 'category', label: 'Category' },
                { key: 'status', label: 'Status' }
            ];
            
            let html = `
                <div class="comparison-table">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 150px;">Features</th>
                                ${properties.map(prop => `<th style="min-width: 220px;">Property ${properties.indexOf(prop) + 1}</th>`).join('')}
                            </tr>
                            <tr>
                                <td class="label-cell">Image</td>
                                ${properties.map(prop => `
                                    <td>
                                        <img src="${prop.image || 'https://placehold.co/300x200?text=No+Image'}" 
                                             class="property-image" 
                                             onerror="this.src='https://placehold.co/300x200?text=No+Image'"
                                             alt="${prop.property}">
                                        <div class="property-name">${prop.property}</div>
                                        <div class="property-price">${prop.price}</div>
                                        <button class="remove-btn" onclick="removeFromCompare(${prop.id})">
                                            <i class="fa-regular fa-trash-can"></i> Remove
                                        </button>
                                    </td>
                                `).join('')}
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            for (const field of fields) {
                html += `
                    <tr>
                        <td class="label-cell">${field.label}</td>
                        ${properties.map(prop => {
                            let value = prop[field.key] || 'N/A';
                            if (field.key === 'status') {
                                const statusClass = value === 'Active' ? 'badge-active' : 'badge-sold';
                                value = `<span class="${statusClass}">${value}</span>`;
                            }
                            if (field.key === 'price') {
                                value = `<span style="color: var(--gold); font-weight: 700;">${value}</span>`;
                            }
                            return `<td>${value}</td>`;
                        }).join('')}
                    </tr>
                `;
            }
            
            html += `
                        </tbody>
                    </table>
                </div>
                <div class="text-center mt-4">
                    <a href="/properties" class="btn-add-more">
                        <i class="fa-solid fa-plus"></i> Add More Properties
                    </a>
                    <button onclick="clearComparison()" class="btn-clear">
                        <i class="fa-solid fa-trash"></i> Clear All
                    </button>
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        function removeFromCompare(propertyId) {
            let compareIds = localStorage.getItem('compareProperties');
            compareIds = compareIds ? JSON.parse(compareIds) : [];
            
            const newIds = compareIds.filter(id => id != propertyId);
            localStorage.setItem('compareProperties', JSON.stringify(newIds));
            
            Swal.fire({
                icon: 'success',
                title: 'Removed!',
                text: 'Property removed from comparison',
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 1500
            });
            
            loadComparison();
        }
        
        function clearComparison() {
            Swal.fire({
                title: 'Clear Comparison?',
                text: 'All properties will be removed from comparison.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, clear',
                cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem('compareProperties');
                    loadComparison();
                    Swal.fire('Cleared!', 'Comparison list cleared.', 'success');
                }
            });
        }
    </script>
</body>
</html>
