<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — NestFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0B1F3A;
            --navy-mid: #1A3558;
            --gold: #C9A84C;
            --white: #FFFFFF;
            --grey: #6B7A99;
            --grey-lt: #E8ECF4;
            --success: #28a745;
            --error: #dc3545;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }

        .auth-header {
            background: var(--navy);
            padding: 40px 30px;
            text-align: center;
            color: var(--white);
        }

        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .brand-logo span { color: var(--gold); }

        .auth-body { padding: 40px 35px; }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 6px;
        }

        .form-control {
            border: 1.5px solid var(--grey-lt);
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.1);
            outline: none;
        }

        .form-control.is-invalid {
            border-color: var(--error);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' width='12' height='12' fill='none' stroke='%23dc3545'%3e%3ccircle cx='6' cy='6' r='4.5'/%3e%3cpath stroke-linejoin='round' d='M5.8 3.6h.4L6 6.5z'/%3e%3ccircle cx='6' cy='8.2' r='.6' fill='%23dc3545' stroke='none'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 35px;
        }

        .form-control.is-valid {
            border-color: var(--success);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3e%3cpath fill='%2328a745' d='M2.3 6.73L.6 4.53c-.4-1.04.46-1.4 1.1-.8l1.1 1.4 3.4-3.8c.6-.63 1.6-.27 1.2.7l-4 4.6c-.43.5-.8.4-1.1.1z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 35px;
        }

        .invalid-feedback {
            font-size: 0.7rem;
            color: var(--error);
            margin-top: 4px;
        }

        .valid-feedback {
            font-size: 0.7rem;
            color: var(--success);
            margin-top: 4px;
        }

        .password-strength {
            margin-top: 8px;
            font-size: 0.7rem;
        }

        .strength-weak { color: var(--error); }
        .strength-medium { color: #fd7e14; }
        .strength-strong { color: var(--success); }

        .btn-auth {
            background: linear-gradient(135deg, var(--navy), var(--navy-mid));
            color: var(--white);
            border: none;
            border-radius: 10px;
            padding: 13px;
            width: 100%;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .btn-auth:hover {
            background: var(--gold);
            color: var(--navy);
            transform: translateY(-2px);
        }

        .btn-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            font-size: 0.8rem;
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 12px 15px;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-logo">Nest<span>Find</span></div>
            <p class="mb-0 opacity-75">Update Your Password</p>
        </div>
        <div class="auth-body">
            {% if error %}
            <div class="alert alert-danger">
                <i class="fa-solid fa-circle-exclamation me-2"></i> {{ error }}
            </div>
            {% endif %}

            <form id="resetForm" method="POST">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <div class="position-relative">
                        <input type="password" name="password" id="password" class="form-control" 
                               placeholder="At least 8 characters" required>
                        <i class="fa-solid fa-eye position-absolute top-50 end-0 translate-middle-y me-3" 
                           id="togglePassword" style="cursor: pointer; color: var(--grey);"></i>
                    </div>
                    <div class="password-strength" id="passwordStrength">
                        <span>Password requirements:</span>
                        <ul style="margin: 4px 0 0 20px; color: var(--grey);">
                            <li id="lengthReq">✗ At least 8 characters</li>
                            <li id="letterReq">✗ At least one letter</li>
                            <li id="numberReq">✗ At least one number</li>
                            <li id="specialReq">✗ At least one special character (!@#$%^&*)</li>
                        </ul>
                    </div>
                    <div class="invalid-feedback" id="passwordInvalid">Please meet all password requirements</div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Confirm New Password</label>
                    <div class="position-relative">
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" 
                               placeholder="Repeat new password" required>
                        <i class="fa-solid fa-eye position-absolute top-50 end-0 translate-middle-y me-3" 
                           id="toggleConfirmPassword" style="cursor: pointer; color: var(--grey);"></i>
                    </div>
                    <div class="invalid-feedback" id="confirmInvalid">Passwords do not match</div>
                </div>

                <button type="submit" class="btn-auth" id="submitBtn">Reset Password</button>
            </form>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm_password');
        const submitBtn = document.getElementById('submitBtn');

        // Password requirement elements
        const lengthReq = document.getElementById('lengthReq');
        const letterReq = document.getElementById('letterReq');
        const numberReq = document.getElementById('numberReq');
        const specialReq = document.getElementById('specialReq');

        function validatePassword() {
            const value = passwordInput.value;
            let isValid = true;

            // Length check (min 8 characters)
            if (value.length >= 8) {
                lengthReq.style.color = '#28a745';
                lengthReq.innerHTML = '✓ At least 8 characters';
            } else {
                lengthReq.style.color = '#dc3545';
                lengthReq.innerHTML = '✗ At least 8 characters';
                isValid = false;
            }

            // Letter check
            if (/[a-zA-Z]/.test(value)) {
                letterReq.style.color = '#28a745';
                letterReq.innerHTML = '✓ At least one letter';
            } else {
                letterReq.style.color = '#dc3545';
                letterReq.innerHTML = '✗ At least one letter';
                isValid = false;
            }

            // Number check
            if (/[0-9]/.test(value)) {
                numberReq.style.color = '#28a745';
                numberReq.innerHTML = '✓ At least one number';
            } else {
                numberReq.style.color = '#dc3545';
                numberReq.innerHTML = '✗ At least one number';
                isValid = false;
            }

            // Special character check
            if (/[!@#$%^&*(),.?":{}|<>]/.test(value)) {
                specialReq.style.color = '#28a745';
                specialReq.innerHTML = '✓ At least one special character';
            } else {
                specialReq.style.color = '#dc3545';
                specialReq.innerHTML = '✗ At least one special character (!@#$%^&*)';
                isValid = false;
            }

            if (isValid && value.length > 0) {
                passwordInput.classList.add('is-valid');
                passwordInput.classList.remove('is-invalid');
                document.getElementById('passwordInvalid').style.display = 'none';
            } else if (value.length > 0) {
                passwordInput.classList.add('is-invalid');
                passwordInput.classList.remove('is-valid');
                document.getElementById('passwordInvalid').style.display = 'block';
            } else {
                passwordInput.classList.remove('is-invalid', 'is-valid');
            }

            validateConfirmPassword();
            return isValid;
        }

        function validateConfirmPassword() {
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            
            if (confirm === '') {
                confirmInput.classList.remove('is-invalid', 'is-valid');
                document.getElementById('confirmInvalid').style.display = 'none';
                return true;
            }
            
            if (password !== confirm) {
                confirmInput.classList.add('is-invalid');
                confirmInput.classList.remove('is-valid');
                document.getElementById('confirmInvalid').style.display = 'block';
                return false;
            } else {
                confirmInput.classList.add('is-valid');
                confirmInput.classList.remove('is-invalid');
                document.getElementById('confirmInvalid').style.display = 'none';
                return true;
            }
        }

        // Real-time validation
        passwordInput.addEventListener('input', validatePassword);
        confirmInput.addEventListener('input', validateConfirmPassword);

        // Form submission validation
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            const isPasswordValid = validatePassword();
            const isConfirmValid = validateConfirmPassword();

            if (!isPasswordValid || !isConfirmValid) {
                e.preventDefault();
                alert('Please fix the errors before submitting.');
            }
        });

        // Password visibility toggles
        document.getElementById('togglePassword').addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
            const type = confirmInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
