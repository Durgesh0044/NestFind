<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites | NestFind</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <style>
        .favorites-header {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            color: white;
        }
        
        .favorite-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 1.5rem;
            border: 1px solid var(--grey-light);
        }
        
        .favorite-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        }
        
        .favorite-img {
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        
        .favorite-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255,255,255,0.95);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--navy);
        }
        
        .favorite-price {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--gold);
        }
        
        .empty-favorites {
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .empty-icon {
            font-size: 4rem;
            color: var(--grey-light);
            margin-bottom: 1rem;
        }
        
        .selection-bar {
            background: var(--cream);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .heart-filled {
            color: #e74c3c;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-mark">
                <span class="brand-icon"><i class="fa-solid fa-building-columns"></i></span>
                <div>
                    <div class="logo-text">Nest<span>Find</span></div>
                </div>
            </div>
            <div class="logo-badge" style="margin-top:6px">Favorites</div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-label">Main</div>
                <a href="{{ url_for('admin.admin_dashboard') }}" class="nav-item" style="text-decoration: none;">
                    <span class="icon">📊</span> Dashboard
                </a>
                <a href="{{ url_for('admin.admin_leads') }}" class="nav-item" style="text-decoration: none;">
                    <span class="icon">👥</span> Leads
                </a>
                <a href="{{ url_for('api.favorites_page') }}" class="nav-item active" style="text-decoration: none;">
                    <span class="icon">❤️</span> Favorites
                </a>
                <a href="{{ url_for('admin.admin_wallet') }}" class="nav-item" style="text-decoration: none;">
                    <span class="icon">💳</span> Wallet
                    <span class="ms-auto" style="font-size:0.75rem; color:var(--gold); font-weight:600; margin-left:auto;">₹{{ "{:,.0f}".format(current_user.wallet_balance or 0) }}</span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-label">Data Management</div>
                <div class="nav-item" onclick="window.location.href='{{ url_for('admin.admin_dashboard') }}#upload-section'">
                    <span class="icon">📄</span> Upload Files
                </div>
            </div>
        </nav>

        <div class="sidebar-footer">
            <div class="admin-card">
                <div class="avatar">{{ admin_initials }}</div>
                <div class="admin-info">
                    <div class="admin-name">{{ admin_name }}</div>
                    <div class="admin-role">Broker</div>
                </div>
                <a href="{{ url_for('auth.logout') }}" style="color:var(--grey-dark);font-size:14px" title="Logout">
                    <i class="fa-solid fa-sign-out-alt"></i>
                </a>
            </div>
        </div>
    </aside>

    <main class="main">
        <div class="content">
            <div class="favorites-header">
                <h1 class="display-5 fw-bold mb-2">
                    <i class="fa-regular fa-heart me-2"></i> My Favorites
                </h1>
                <p class="mb-0 opacity-75">Properties you've saved for later</p>
            </div>

            <div id="favoritesContent">
                <div class="text-center py-5">
                    <div class="spinner-border text-gold" role="status"></div>
                    <p class="mt-3">Loading your favorites...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Load favorites on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadFavorites();
        });

        function loadFavorites() {
            fetch('/api/favorites/list')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('favoritesContent');
                    
                    if (!data.success || data.properties.length === 0) {
                        container.innerHTML = `
                            <div class="empty-favorites">
                                <div class="empty-icon">
                                    <i class="fa-regular fa-heart"></i>
                                </div>
                                <h3>No favorites yet</h3>
                                <p class="text-muted">Start saving properties you love by clicking the heart icon on any property listing.</p>
                                <a href="/properties" class="btn btn-primary mt-3" style="background: var(--gold); border: none;">
                                    Browse Properties
                                </a>
                            </div>
                        `;
                        return;
                    }
                    
                    let selectedIds = new Set();
                    
                    function renderFavorites() {
                        const filteredProperties = selectedIds.size === 0 ? data.properties : data.properties.filter(p => selectedIds.has(p.id));
                        
                        container.innerHTML = `
                            <div class="selection-bar">
                                <div>
                                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                                    <label for="selectAll" class="ms-2">Select All (${data.properties.length})</label>
                                </div>
                                <div>
                                    <button class="btn btn-sm btn-outline-danger" onclick="removeSelected()" ${selectedIds.size === 0 ? 'disabled' : ''}>
                                        <i class="fa-regular fa-trash-can me-1"></i> Remove Selected (${selectedIds.size})
                                    </button>
                                    <button class="btn btn-sm btn-outline-primary ms-2" onclick="compareSelected()" ${selectedIds.size < 2 ? 'disabled' : ''}>
                                        <i class="fa-solid fa-chart-simple me-1"></i> Compare (${selectedIds.size})
                                    </button>
                                </div>
                            </div>
                            <div class="row">
                                ${filteredProperties.map(prop => `
                                    <div class="col-12">
                                        <div class="favorite-card">
                                            <div class="row g-0">
                                                <div class="col-md-3">
                                                    <div class="favorite-img" style="background-image: url('${prop.image}');">
                                                        <div class="favorite-badge">
                                                            <input type="checkbox" class="favorite-checkbox" value="${prop.id}" onchange="updateSelection()" ${selectedIds.has(prop.id) ? 'checked' : ''}>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-md-9">
                                                    <div class="p-3">
                                                        <div class="d-flex justify-content-between align-items-start">
                                                            <div>
                                                                <h5 class="fw-bold mb-1">${prop.property}</h5>
                                                                <p class="text-muted small mb-2">
                                                                    <i class="fa-solid fa-location-dot me-1"></i> ${prop.location}
                                                                </p>
                                                                <div class="d-flex gap-3 mb-3">
                                                                    <span class="badge bg-light text-dark">${prop.type || 'For Sale'}</span>
                                                                    <span class="badge bg-light text-dark">${prop.bedrooms}</span>
                                                                    <span class="badge bg-light text-dark">${prop.area}</span>
                                                                </div>
                                                            </div>
                                                            <div class="text-end">
                                                                <div class="favorite-price">${prop.price}</div>
                                                                <small class="text-muted">Saved ${new Date(prop.favorited_at).toLocaleDateString()}</small>
                                                            </div>
                                                        </div>
                                                        <div class="d-flex gap-2 mt-3">
                                                            <a href="/property/${prop.id}" class="btn btn-sm" style="background: var(--navy); color: white;">
                                                                <i class="fa-regular fa-eye me-1"></i> View Details
                                                            </a>
                                                            <button class="btn btn-sm btn-outline-danger" onclick="removeFavorite(${prop.id})">
                                                                <i class="fa-regular fa-trash-can me-1"></i> Remove
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }
                    
                    window.updateSelection = function() {
                        selectedIds.clear();
                        document.querySelectorAll('.favorite-checkbox:checked').forEach(cb => {
                            selectedIds.add(parseInt(cb.value));
                        });
                        renderFavorites();
                    };
                    
                    window.toggleSelectAll = function() {
                        const selectAll = document.getElementById('selectAll');
                        document.querySelectorAll('.favorite-checkbox').forEach(cb => {
                            cb.checked = selectAll.checked;
                        });
                        updateSelection();
                    };
                    
                    window.removeSelected = function() {
                        if (selectedIds.size === 0) return;
                        Swal.fire({
                            title: 'Remove favorites?',
                            text: `Remove ${selectedIds.size} properties from favorites?`,
                            icon: 'warning',
                            showCancelButton: true,
                            confirmButtonColor: '#d33',
                            confirmButtonText: 'Yes, remove'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                fetch('/api/favorites/remove', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ property_ids: Array.from(selectedIds) })
                                })
                                .then(res => res.json())
                                .then(data => {
                                    if (data.success) {
                                        Swal.fire('Removed!', data.message, 'success');
                                        loadFavorites(); // Reload
                                    }
                                });
                            }
                        });
                    };
                    
                    window.removeFavorite = function(propertyId) {
                        fetch('/api/favorites/remove', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ property_ids: [propertyId] })
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.success) {
                                loadFavorites();
                                showToast('Removed from favorites', 'success');
                            }
                        });
                    };
                    
                    window.compareSelected = function() {
                        const ids = Array.from(selectedIds);
                        if (ids.length < 2) return;
                        localStorage.setItem('compareProperties', JSON.stringify(ids));
                        window.location.href = '/compare';
                    };
                    
                    renderFavorites();
                });
        }
        
        function showToast(msg, type) {
            // Simple toast implementation
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white bg-${type === 'success' ? 'success' : 'danger'} border-0`;
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${msg}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            document.body.appendChild(toast);
            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>

</html>
